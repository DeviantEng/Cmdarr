name: Scheduled image rebuild (develop + main, no cache)

# No-cache rebuild of the currently pinned base digests (app layers / Buildx cache).
# Wolfi/OpenSSL packages do not change until Dockerfile FROM digests change —
# Renovate opens those PRs to develop; a green :develop publish then opens a
# Dockerfile-only PR to main (no app version bump).

on:
  schedule:
    # Mondays 06:45 UTC (~ late Sunday US / Monday morning overlap for weekday review).
    - cron: "45 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-rebuild:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    strategy:
      fail-fast: false
      matrix:
        ref:
          - develop
          - main
    steps:
      - name: Trigger docker-publish on ${{ matrix.ref }} (no cache)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run docker-publish.yml
          --repo "${{ github.repository }}"
          --ref "${{ matrix.ref }}"
          -f no_cache=true
