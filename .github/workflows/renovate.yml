# Renovate self-hosted runner (opens PRs against develop per renovate.json).
#
# Use this workflow *or* the Mend Renovate GitHub App, not both — duplicate PRs.
# Scheduled runs use the workflow file on the default branch (main). Until that
# exists, start it from Actions → Renovate → Run workflow (select develop).

name: Renovate

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@5402b206248e5a8c8427a15102702eb9c1793efc # v46.2.4
        with:
          token: ${{ github.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          LOG_LEVEL: info
